workflows:
  voice-nav-debug:
    name: VoiceNav Evneet Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    working_directory: VoiceNav_Evneet

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build VoiceNav APK
        script: |
          gradle assembleDebug --no-daemon

      - name: Collect APK
        script: |
          echo "Searching for APK..."
          find . -name "*.apk" -print
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi
          echo "Found: $APK"
          cp "$APK" "$CM_BUILD_DIR/VoiceNav-Evneet.apk"
          ls -lh "$CM_BUILD_DIR/VoiceNav-Evneet.apk"

    artifacts:
      - VoiceNav-Evneet.apk
